name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/publish-java-package.yml
      - README.md

  pull_request:
    paths-ignore:
      - .github/workflows/publish-java-package.yml
      - README.md

env:
  IS_CICD: 1
  SCYLLA_VERSION: release:2025.2.5

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Check formatting and javadocs
        run: make lint

  build-and-test:
    name: Build and Test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [11, 17]
      fail-fast: false

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3

      - name: Compile main code
        run: make compile

      - name: Compile test code
        run: make compile-test

      - name: Compile demo apps
        run: make compile-demo

      - name: Run unit tests
        run: make test-unit

      - name: Upload unit test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: unit-test-results-java-${{ matrix.java-version }}
          path: target/surefire-reports/*.xml

      - name: Cache Scylla relocatable package
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccm/scylla-repository
          key: scylla-ccm-relocatable-${{ runner.os }}-${{ runner.arch }}-release-2025.2.5

      - name: Run integration tests
        timeout-minutes: 30
        run: make test-integration

      - name: Upload integration test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: integration-test-results-java-${{ matrix.java-version }}
          path: target/surefire-reports/*.xml

      - name: Upload CCM diagnostics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ccm-diagnostics-java-${{ matrix.java-version }}
          path: target/ccm/**
          if-no-files-found: ignore
