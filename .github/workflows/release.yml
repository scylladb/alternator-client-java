name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: run without pushing SCM changes to upstream'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: skip project tests during validation; release helper tests always run'
        default: false

      target-tag:
        type: string
        description: 'target-tag: main, or a tag whose preceding commit passes release credential safety checks. Other branches and unsafe historical targets are unsupported.'
        default: main

      release-version:
        required: false
        type: string
        description: 'release-version: override next version'

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      target-sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Checkout validation source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Block release with open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "$blocker" ]]; then
            blocker_title=$(jq -r '.title' <<< "$blocker")
            blocker_url=$(jq -r '.url' <<< "$blocker")
            echo "Release blocked by open release blocker:"
            echo "${blocker_title} (${blocker_url})"
            exit 1
          fi

      - name: Set up validation Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Validate release tooling
        run: |
          python3 scripts/release/guard.py check
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Preserve validation guard
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        run: |
          if [[ "$RELEASE_TARGET_TAG" == main ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "Releases targeting main must be dispatched from main."
              exit 1
            fi
          fi
          mkdir -p "$RUNNER_TEMP/release-safety"
          cp scripts/release/*.py scripts/release/publisher.asc Makefile "$RUNNER_TEMP/release-safety/"
          echo "RELEASE_GUARD=$RUNNER_TEMP/release-safety/guard.py" >> "$GITHUB_ENV"
          echo "RELEASE_LOG_DIR=$RUNNER_TEMP/release-logs" >> "$GITHUB_ENV"

      - name: Resolve validation target
        id: target
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        run: |
          if [[ "$RELEASE_TARGET_TAG" != main ]]; then
            git check-ref-format "refs/tags/$RELEASE_TARGET_TAG"
            git checkout "refs/tags/$RELEASE_TARGET_TAG~1"
          fi
          git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"

      - name: Validate target without release credentials
        env:
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
        run: |
          python3 "$RELEASE_GUARD" check
          if [[ "$RELEASE_SKIP_TESTS" == true ]]; then
            export MAVEN_OPTS="${MAVEN_OPTS:-} -DskipTests=true -DskipITs=true"
          fi
          python3 "$RELEASE_GUARD" run mvn -B --no-transfer-progress -Prelease -Dgpg.skip=true verify

      - name: Upload sanitized validation stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stdout
          path: ${{ runner.temp }}/release-logs/stdout.log
          if-no-files-found: ignore

      - name: Upload sanitized validation stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    # Approval is requested only after validation succeeds on a separate runner.
    # Owners must provision protection and environment secrets before releasing.
    environment: release

    permissions:
      contents: write
      issues: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}

      - name: Preserve release guard
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        run: |
          if [[ "$RELEASE_TARGET_TAG" == main ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "Releases targeting main must be dispatched from main."
              exit 1
            fi
          fi
          mkdir -p "$RUNNER_TEMP/release-safety"
          cp scripts/release/*.py scripts/release/publisher.asc Makefile "$RUNNER_TEMP/release-safety/"
          echo "RELEASE_GUARD=$RUNNER_TEMP/release-safety/guard.py" >> "$GITHUB_ENV"
          echo "RELEASE_LOG_DIR=$RUNNER_TEMP/release-logs" >> "$GITHUB_ENV"

      - name: Checkout release target
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
          RELEASE_TARGET_COMMIT: ${{ needs.validate.outputs.target-sha }}
        run: |
          [[ "$RELEASE_TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$RELEASE_TARGET_COMMIT"
          if [[ "$RELEASE_TARGET_TAG" == main ]]; then
            git checkout -B main "$RELEASE_TARGET_COMMIT"
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "main advanced after validation; start a new release workflow."
              exit 1
            fi
          else
            git checkout --detach "$RELEASE_TARGET_COMMIT"
          fi

      - name: Check release credential safety before importing credentials
        run: python3 "$RUNNER_TEMP/release-safety/guard.py" check

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: central
          server-username-env-var: SONATYPE_TOKEN_USERNAME
          server-password-env-var: SONATYPE_TOKEN_PASSWORD

      - name: Prepare release
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_SKIP_TESTS: 'true'
          RELEASE_VERSION: ${{ inputs.release-version }}
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
          IS_CICD: true
        run: |
          baseline=$(git rev-parse HEAD)
          export RELEASE_BASE_COMMIT="$baseline"
          echo "RELEASE_BASE_COMMIT=$baseline" >> "$GITHUB_ENV"
          make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" release-prepare

      - name: Verify prepared release commits and tag with public key only
        run: python3 "$RUNNER_TEMP/release-safety/signing.py" verify-prepared

      - name: Recheck for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "$blocker" ]]; then
            blocker_title=$(jq -r '.title' <<< "$blocker")
            blocker_url=$(jq -r '.url' <<< "$blocker")
            echo "Release blocked by open release blocker:"
            echo "${blocker_title} (${blocker_url})"
            exit 1
          fi

      - name: Perform release
        if: inputs.dry-run == false
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          RELEASE_SKIP_TESTS: 'true'
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          IS_CICD: true
        run: make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" release

      - name: Perform release dry-run
        if: inputs.dry-run == true
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          RELEASE_SKIP_TESTS: 'true'
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          IS_CICD: true
        run: make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" release-dry-run

      - name: Push changes to SCM
        if: ${{ inputs.dry-run == false && inputs.target-tag == 'main' }}
        run: |
          git status && git log -3
          git push origin --follow-tags -v

      - name: Upload sanitized stdout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stdout
          path: ${{ runner.temp }}/release-logs/stdout.log
          if-no-files-found: ignore

      - name: Upload sanitized stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stderr
          path: ${{ runner.temp }}/release-logs/stderr.log
          if-no-files-found: ignore
