name: Release credential safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-credential-safety:
    name: Release credential safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/release.yml .github/workflows/release-dry-run.yml .github/workflows/label-release-notes.yml .github/workflows/release-credential-safety.yml
      - run: python3 scripts/release/guard.py check
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix .github
      - run: node --test .github/scripts/*.test.cjs
