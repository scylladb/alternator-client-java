name: Classify release notes

on:
  # Fork PRs need label writes; the action reads repository configuration by API.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to reclassify, including an already merged PR'
        required: true
        type: number

concurrency:
  group: classify-release-notes-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile omission label
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: true
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
