name: Classify release notes

on:
  # Fork PRs need label writes; every run checks out only trusted default-branch code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to reclassify, including an already merged PR'
        required: true
        type: number

concurrency:
  group: classify-release-notes-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted classifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile omission label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: python3 scripts/release/notes.py classify
